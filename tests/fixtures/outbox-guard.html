<!doctype html><meta charset="utf-8"><title>Disposable outbox guard fixture</title>
<p>Local fixture with fake accounts and conversations. No providers.</p>
<script type="module">
import {appTransaction,getMeta,entity,writeOutbox,writeEntity} from '/src/lib/appStore.ts';
import {fixedOutbox} from './storage-fixture.ts';
import {rememberOwner} from '/src/lib/appContext.ts';
import {syncNow,syncState,receiveSyncPage} from '/src/lib/appSync.ts';
import {downloadEntity} from '/src/lib/appTransfers.ts';
import {JsonStream} from '/src/lib/jsonStream.ts';

const scenario=new URL(location.href).searchParams.get('scenario')??'legacy';
const owner='fixture-owner-a',root='sync:'+owner+':outbox',foreign='sync:0-foreign:outbox';
const transfer='11111111-1111-4111-8111-111111111111';
const check=(condition,message)=>{if(!condition)throw Error(message);};
const digest=async raw=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',raw)),b=>b.toString(16).padStart(2,'0')).join('');

async function receive(){
  rememberOwner(owner);
  const key='sync:'+owner+':',payload={storage_policy:'sync',settings:{session_id:'chat',library_binding:null},state:{session_id:'chat'},messages:[{id:1,uuid:'old',role:'user',content:'ORIGINAL'}],memories:[],summaries:[]};
  const original={id:'chat',owner,kind:'conversation',revision:1,serverRevision:1,dirty:false,deleted:false,pinned:false,opened:1,payload};
  await appTransaction(['entities','meta'],'readwrite',(tx,done)=>{tx.objectStore('entities').put(original);tx.objectStore('meta').put(true,key+'consent');tx.objectStore('meta').put(11,key+'cursor');done();});
  const next={...payload,messages:Array.from({length:28},(_,index)=>({id:index+1,uuid:'receive-'+index,role:'user',content:'茶🙂'.repeat(11000)}))};
  let raw=new TextEncoder().encode(JSON.stringify(next));
  if(scenario==='receive-syntax')raw=raw.subarray(0,raw.length-1);
  if(scenario==='receive-utf8'){const invalid=new Uint8Array(raw.length+1);invalid.set(raw);invalid[raw.length]=0xff;raw=invalid;}
  const remote={id:'chat',kind:'conversation',revision:2,deleted:false,payload_ref:{id:'chat',revision:2,transfer_id:transfer,size:raw.length,sha256:scenario==='receive-hash'?'0'.repeat(64):await digest(raw),chunks:Math.ceil(raw.length/(1024*1024)),chunk_bytes:1024*1024}};
  const parse=JSON.parse,decode=TextDecoder.prototype.decode;let largestScalar=0,largestDecode=0,parts=0,failed=false;
  JSON.parse=function(text,...args){largestScalar=Math.max(largestScalar,text.length);return parse.call(this,text,...args);};
  TextDecoder.prototype.decode=function(input,...args){largestDecode=Math.max(largestDecode,input?.byteLength??0);return decode.call(this,input,...args);};
  try{
    try{
      const result=await downloadEntity(remote,async path=>{
        const index=Number(path.split('/').at(-1)),chunk=raw.subarray(index*1024*1024,(index+1)*1024*1024);parts++;
        if(scenario==='receive-withdrawal'&&index===remote.payload_ref.chunks-1)await appTransaction(['meta'],'readwrite',(tx,done)=>{tx.objectStore('meta').put(false,key+'consent');done();});
        let binary='';for(let start=0;start<chunk.length;start+=8192)binary+=String.fromCharCode(...chunk.subarray(start,start+8192));
        return {data:btoa(binary),sha256:await digest(chunk)};
      },async()=>{check((await getMeta(key+'consent'))===true,'Consent changed');});
      await receiveSyncPage(owner,[result],12);
    }catch(error){failed=true;if(scenario==='receive')throw error;}
    const saved=await entity('chat',owner),cursor=await getMeta(key+'cursor');
    if(scenario==='receive')check(!failed&&saved.payload.messages.length===28&&saved.serverRevision===2&&cursor===12,'Valid receive did not commit');
    else check(failed&&JSON.stringify(saved)===JSON.stringify(original)&&cursor===11&&!await getMeta(key+'remote:chat'),'Failed receive advanced data or cursor');
    check(largestDecode<=1024*1024&&largestScalar<100000,'Receive parsed the entire encoded entity');
    check(!('payload' in remote),'Unverified payload leaked into its reference');
    return {ok:true,scenario,parts,failed,cursor,largestDecode,largestScalar,originalPreserved:scenario!=='receive'};
  }finally{JSON.parse=parse;TextDecoder.prototype.decode=decode;}
}

async function run(){
  rememberOwner(owner);localStorage.setItem('fixture-existing-storage','retain');
  const source={id:'chat',owner,kind:'conversation',revision:1,serverRevision:0,dirty:true,deleted:false,pinned:false,opened:1,
    payload:{storage_policy:'sync',rating:'general',settings:{session_id:'chat',library_binding:null},state:{session_id:'chat'},
      messages:Array.from({length:28},(_,index)=>({id:index+1,uuid:'fixture-'+index,role:'user',content:'large fixture '.repeat(6000)})),memories:[],summaries:[]}};
  const pending={request_id:'fixture-large',revisions:{chat:1},changes:[{id:'chat',kind:'conversation',base_revision:0,payload:source.payload,deleted:false}]};
  if(scenario==='fresh')pending.withdrawn=0;
  const opened=indexedDB.open('kyalulu-app-v1',1);
  opened.onupgradeneeded=()=>{opened.result.createObjectStore('entities',{keyPath:['owner','id']});opened.result.createObjectStore('meta');};
  const old=await new Promise((resolve,reject)=>{opened.onsuccess=()=>resolve(opened.result);opened.onerror=()=>reject(opened.error);});
  await new Promise((resolve,reject)=>{const tx=old.transaction(['entities','meta'],'readwrite');tx.objectStore('entities').put(source);
    tx.objectStore('meta').put(pending,root);tx.objectStore('meta').put(true,'sync:'+owner+':consent');
    tx.objectStore('meta').put({request_id:pending.request_id,withdrawn:0,private:'OTHER ACCOUNT BODY'},foreign);
    tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error);});old.close();
  if(scenario!=='legacy')await appTransaction(['entities','meta','parts'],'readwrite',(tx,done)=>{writeEntity(tx,source);writeOutbox(tx,owner,pending,done);});
  const header=await getMeta(root),ref=header.changesParts,current=await fixedOutbox(owner);
  if(scenario!=='legacy')check(ref?.chunks>1,'Segmented fixture has no saved parts');
  check(JSON.stringify(current.changes)===JSON.stringify(pending.changes),'Migration changed private data');
  const expected=new TextEncoder().encode(JSON.stringify({request_id:pending.request_id,changes:pending.changes})),expectedHash=await digest(expected);
  let bodyReads=0,foreignReads=0,keyProbes=0,committed=false,startedReads=0,headerPayloadReads=0,restoredPayloads=0,streamPasses=0;
  const counts=[],partCounts=[],partReads=[],chunks=[],api=[];
  let measuring=true,maxEncodedText=0,wholeBatchWrites=0,compactHeaderWrites=0,hashAccountChanged=false;
  const originalEncode=TextEncoder.prototype.encode,originalStringify=JSON.stringify,originalFinish=JsonStream.prototype.finish;
  TextEncoder.prototype.encode=function(text){
    if(measuring)maxEncodedText=Math.max(maxEncodedText,text?.length??0);
    return originalEncode.call(this,text);
  };
  JSON.stringify=function(value,...args){
    if(measuring&&value?.request_id===pending.request_id&&Array.isArray(value.changes)){
      if(value.changes.some(change=>Object.keys(change.payload??{}).length))wholeBatchWrites++;else compactHeaderWrites++;
    }
    return originalStringify.call(this,value,...args);
  };
  JsonStream.prototype.finish=function(...args){
    const value=originalFinish.apply(this,args),changes=Array.isArray(value)?value:value?.changes;
    if(measuring&&Array.isArray(changes)&&changes.some(change=>change?.id==='chat'&&change.kind==='conversation')){
      if(changes.some(change=>Object.keys(change.payload??{}).length))restoredPayloads++;
      if(value.request_id===pending.request_id)streamPasses++;
    }
    return value;
  };
  let storagePartReads=0;const originalGet=IDBObjectStore.prototype.get,originalKeys=IDBIndex.prototype.openKeyCursor;
  IDBObjectStore.prototype.get=function(key){
    const read=originalGet.call(this,key);
    if(measuring&&this.name==='parts'){
      if(key[0]!==owner)foreignReads++;
      if(key[1]==='outbox'){
        storagePartReads++;partReads.push({key:[...key],mode:this.transaction.mode});
        if(scenario==='hash-account'&&!hashAccountChanged)read.addEventListener('success',()=>{hashAccountChanged=true;rememberOwner('fixture-owner-b');},{once:true});
      }
    }
    if(measuring&&this.name==='meta'){
      if(key===foreign)foreignReads++;
      if(key===root){bodyReads++;read.addEventListener('success',()=>{
        if(ref&&read.result?.changes?.some(change=>Object.keys(change.payload??{}).length))headerPayloadReads++;
      },{once:true});}
    }
    return read;
  };
  IDBIndex.prototype.openKeyCursor=function(...args){if(this.name==='sync-outbox-state')keyProbes++;return originalKeys.apply(this,args);};
  globalThis.fetch=async(input,init={})=>{
    const path=String(input);api.push(path);
    check(path.startsWith('/api/'),'Unexpected fetch');
    const reply=value=>new Response(JSON.stringify(value),{headers:{'Content-Type':'application/json'}});
    if(path==='/api/mobile/status')return reply({cloud_mode:true,authenticated:true,owner_scope:owner});
    check(new Headers(init.headers).get('X-Kyalulu-Owner')===owner,'Wrong account header');
    if(path==='/api/cloud/app/sync/transfers'){
      const current=await getMeta(root);check(current.request_id===pending.request_id&&current.withdrawn===0,'Legacy index normalization failed');
      const manifest=JSON.parse(init.body);check(manifest.request_id===pending.request_id&&manifest.size===expected.length&&manifest.sha256===expectedHash,'Manifest differs from original body');
      check(storagePartReads===(ref?.chunks??0),'Hashing did not read exactly one saved-part pass');
      startedReads=bodyReads;return reply({transfer_id:transfer,next:0,chunk_bytes:1024*1024});
    }
    if(path.includes('/parts/')){
      counts.push(bodyReads);partCounts.push(storagePartReads);const part=JSON.parse(init.body),raw=Uint8Array.from(atob(part.data),c=>c.charCodeAt(0));
      check(path.endsWith('/parts/'+chunks.length)&&raw.length===Math.min(1024*1024,expected.length-chunks.length*1024*1024),'Invalid part order or framing');
      check(await digest(raw)===part.sha256,'Part hash mismatch');chunks.push(raw);
      if(chunks.length===1&&scenario!=='legacy'&&scenario!=='fresh'){
        if(scenario==='account')rememberOwner('fixture-owner-b');
        else await appTransaction(['meta'],'readwrite',(tx,done)=>{const meta=tx.objectStore('meta'),r=meta.get(root);r.onsuccess=()=>{meta.put(scenario==='withdrawal'?{...r.result,withdrawn:true}:{...r.result,request_id:'replacement'},root);done();};});
      }
      return reply({next:chunks.length});
    }
    if(path.endsWith('/commit')){counts.push(bodyReads);partCounts.push(storagePartReads);committed=true;return reply({changes:[{id:'chat',revision:1,deleted:false}]});}
    check(path.startsWith('/api/cloud/app/sync?'),'Unexpected API');return reply({changes:[],cursor:committed?1:0,has_more:false});
  };
  try{
    await syncNow(owner);
    measuring=false;
    const saved=await entity('chat',owner),remaining=await getMeta(root);
    if(scenario==='legacy'||scenario==='fresh'){
      check(chunks.length===3&&committed,'Transfer did not complete');
      if(ref){
        // Header fence reads are expected; only immutable saved parts make two sequential passes.
        check(partReads.length===2*ref.chunks&&partReads.every((read,index)=>read.mode==='readonly'&&JSON.stringify(read.key)===JSON.stringify([owner,'outbox','fixed',ref.token,index%ref.chunks])),'Saved parts were not read in two readonly sequential passes');
        check(partCounts.every((count,index)=>count===ref.chunks+Math.min(index+1,ref.chunks))&&streamPasses===2,'Upload reread a whole outbox per part');
      }else check(counts.every(count=>count===startedReads)&&partCounts.every(count=>count===0),'Legacy upload reloaded its body');
      check(!remaining&&!saved.dirty&&saved.serverRevision===1,'Receipt did not settle atomically');
      const raw=new Uint8Array(chunks.reduce((total,chunk)=>total+chunk.length,0));let offset=0;for(const chunk of chunks){raw.set(chunk,offset);offset+=chunk.length;}
      check(raw.length===expected.length&&raw.every((byte,index)=>byte===expected[index])&&await digest(raw)===expectedHash,'Body changed during migration');
    }else if(scenario==='hash-account'){
      check(hashAccountChanged&&chunks.length===0&&!committed&&saved.dirty&&remaining,'Account change during hashing did not stop before transfer start');
      check(!api.some(path=>path.includes('/transfers')),'Hashing sent a manifest after the account changed');
    }else{
      check(chunks.length===1&&!committed&&saved.dirty&&remaining,'Control change did not fence the body');
    }
    if(scenario!=='legacy'&&scenario!=='fresh')check(JSON.stringify(saved)===JSON.stringify(source),'Failed upload changed local unsent data');
    check(!ref||headerPayloadReads===0&&restoredPayloads===0,'Segmented upload restored a full payload');
    check(foreignReads===0,'Read another account body');
    check(maxEncodedText<=4096*6&&wholeBatchWrites===0,'Serializer buffered the entire batch: '+JSON.stringify({maxEncodedText,wholeBatchWrites}));
    check(localStorage.getItem('fixture-existing-storage')==='retain','Unrelated storage changed');
    const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('kyalulu-app-v1');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
    check(db.version===3&&db.transaction('meta').objectStore('meta').indexNames.contains('sync-outbox-state'),'Index upgrade missing');db.close();
    return {ok:true,scenario,parts:chunks.length,committed,keyProbes,bodyReads,foreignReads,maxEncodedText,wholeBatchWrites,compactHeaderWrites,storagePartReads,partCounts,partReads,headerPayloadReads,restoredPayloads,streamPasses,hashAccountChanged,state:syncState().phase,networkCalls:api.length};
  }finally{IDBObjectStore.prototype.get=originalGet;IDBIndex.prototype.openKeyCursor=originalKeys;TextEncoder.prototype.encode=originalEncode;JSON.stringify=originalStringify;JsonStream.prototype.finish=originalFinish;}
}
(scenario.startsWith('receive')?receive():run()).then(result=>window.__OUTBOX_RESULT__=result).catch(error=>window.__OUTBOX_RESULT__={ok:false,scenario,error:String(error),stack:error.stack});
</script>
