// Normalize only inherently random memory IDs. UUIDs, bijection, fresh IDs and every occurrence are checked first.
function normalized(payload,validate=false,original){
  const copy=structuredClone(payload),stableToId=new Map(),idToStable=new Map();

  const bind=rows=>{for(const m of rows??[]){
    if(validate){
      check(uuid(m.id)&&!oldIds.has(m.id),'Branch memory ID was not freshly allocated');
      check(!stableToId.has(m.uuid)||stableToId.get(m.uuid)===m.id,'One stable memory UUID received multiple IDs');
      check(!idToStable.has(m.id)||idToStable.get(m.id)===m.uuid,'Distinct memory UUIDs share one allocated identity');

    for(const [method,body,status] of [['GET',undefined,405],['POST',{},400],['POST',{message_id:0},400],['POST',{message_id:1.5},400]]){
      const result=await api(method,'/api/chat/sessions/'+actorId+'/branch',body);check(result.status===status,'Branch method/body contract');
      same(await physical(),snapshot,'Invalid contract changed stored data/sequence');evidence.statuses.push(result.status);
    }
    await navigator.locks.request(deviceExecutionLockName(owner),async()=>{
      const result=await branch(ids[0]);check(result.status===409,'Busy Device execution lease allowed branch');
      same(await physical(),snapshot,'Busy branch changed stores/sequence');
    });evidence.execution_lease_refused=true;
  }else throw Error('Unknown branch scenario '+scenario);
  same(fixedPhysical(await physical()),fixedBefore,'Fixed outbox physical header/token/bytes changed');
  await rememberExpected(initial);window.__BRANCH_PROGRESS__.stage='passed';
  return {ok:true,scenario,policy,mode,messages:count,source_bytes:initial.source_bytes,source_parts:initial.source_parts,
    frozen_baseline:frozen.baseline,fixed_outbox_physically_unchanged:true,...evidence};
}
window.__DEVICE_BRANCHES__={run,resume,selfCheck};
</script>
