    // Queue a real competing IDB transaction after source admission, before its receipt read resolves.
    IDBObjectStore.prototype.get=function(key){const request=get.call(this,key);
      if(this.name==='meta'&&key==='generation:'+owner+':stored'&&!injected){
        request.addEventListener('success',()=>{
          injected=true;competing=appTransaction(['entities','parts'],'readwrite',(tx,done)=>{
            const parts=tx.objectStore('parts');let index=0;
            const next=()=>{
              if(scenario==='cas-revision'||index===h.payloadParts.chunks){tx.objectStore('entities').put(concurrent);done();return;}
              const i=index++,read=get.call(parts,partKey(h,i));
              read.onsuccess=()=>{parts.put(read.result,partKey(concurrent,i));parts.delete(partKey(h,i));next();};
            };next();
          });
        },{once:true});
      }return request;
    };
    try{
      const result=await api('PUT');await competing;check(result.status>=400,'Stale source CAS accepted');evidence.rejection=result;
      same(await physical(),snapshot,'CAS changed more than the real competing header/parts');
    }finally{IDBObjectStore.prototype.get=get;}
    check(injected,'CAS receipt gate not reached');initial.actor=await entity(actorId,owner);
    evidence.competing_header={revision:concurrent.revision,body_token:concurrent.payloadParts.token,real_idb_commit:true};
  }else if(scenario==='contracts'){
    snapshot=await physical();const cases=[['PATCH',ids[0],{content:''},400],['PUT',ids[0],{content:'x'.repeat(128001)},400],
      ['PUT',ids[0],{content:7},400],['PATCH',999999,{content:'Missing'},404]];
    evidence.rejections=[];
    for(const [method,id,body,status] of cases){const value=await api(method,id,body);check(value.status===status,'Invalid body/missing ID status');
      same(await physical(),snapshot,'Invalid request changed storage');evidence.rejections.push(value.status);}
    await navigator.locks.request(deviceExecutionLockName(owner),async()=>{
      const result=await rejection('CLEAR',null,snapshot,'Execution lock');check(result.status===409,'Execution lock contract');
    });
    const pending=await saveEntity({...initial.actor,payload:{...initial.actor.payload,pending_generation:'pending-fiction'}},initial.actor.revision);
    const pendingSnapshot=await physical();
    const result=await rejection('PUT',ids[0],pendingSnapshot,'Pending generation');check(result.status===409,'Pending contract');
    initial.actor=await saveEntity({...pending,payload:{...pending.payload,pending_generation:null}},pending.revision);
  }else throw Error('Unknown fault '+scenario);
  const method=scenario==='quota-clear'?'CLEAR':'PUT';
  const {value,stats}=await observedApi(method,ids[0]);same(value,{status:200,data:{ok:true}},'Fresh retry outward contract');
  await verify(initial,method,ids[0],stats);
  return {...evidence,atomic_retry_succeeded:true,retry_observation:stats};
}
async function run(scenario){
  window.__HISTORY_PROGRESS__={scenario,stage:'seed'};window.__PROJECTION_PROGRESS__=window.__HISTORY_PROGRESS__;
  const flowCase=scenario.startsWith('flow-'),mode=scenario.includes('shared')||scenario==='quota-clear'?'shared':
    scenario.includes('world')||['quota-scoped','owner-switch','cas-revision','cas-token'].includes(scenario)?'world':'legacy';
  const policy=scenario.endsWith('sync')||scenario==='quota-clear'?'sync':'local';
  const initial=await seed(policy,mode),before=fixedPhysical(await physical());
  window.__HISTORY_PROGRESS__.stage='exercise';
  const evidence=flowCase?await flow(initial):await fault(initial,scenario);
  same(fixedPhysical(await physical()),before,'Fixed outbox physical bytes/token changed');
  await saveExpected(policy);window.__HISTORY_PROGRESS__.stage='passed';
  return {ok:true,scenario,policy,mode,source_bytes:initial.source_bytes,source_parts:initial.source_parts,messages:count,
    golden_source_sha256:new Sha256().update(encoder.encode(goldenChangeHistorySource)).digest(),fixed_outbox_physically_unchanged:true,...evidence};
}
window.__HISTORY_MUTATIONS__={run,resume};
