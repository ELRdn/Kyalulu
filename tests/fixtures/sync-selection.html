<!doctype html><meta charset="utf-8"><title>Disposable sync selection acceptance</title>
<p>Fictional accounts only. External requests and real APIs are forbidden.</p>
<script type="module">
import history from './unified-history.json';
import {appTransaction,entity,getMeta} from '/src/lib/appStore.ts';
import {rememberOwner,deviceOwner} from '/src/lib/appContext.ts';
import {receiveSyncPage,syncNow,syncState} from '/src/lib/appSync.ts';
import {receiveLibrarySnapshot,receiveCreatorSnapshot,rebindConversation,canonical} from '/src/lib/appSyncData.ts';

const scenario=new URL(location.href).searchParams.get('scenario');
const owner='fixture-selection-owner',foreign='fixture-selection-foreign',prefix='sync:'+owner+':';
const creator='created_'+'a'.repeat(32),count=160,maximum=50000,foreignMaximum=9000000;
const check=(value,message)=>{if(!value)throw Error(message);};
const same=(a,b,message)=>check(canonical(a)===canonical(b),message);
const record=(id,payload,extra={})=>({id,owner,kind:'conversation',revision:1,serverRevision:1,
  dirty:false,deleted:false,pinned:true,opened:1,payload,...extra});
const basic=(id,number=1)=>({storage_policy:'sync',settings:{session_id:id,library_binding:null},
  state:{session_id:id},messages:[{id:number,uuid:id+'-message',role:'user',content:'FICTIONAL '+id}],memories:[],summaries:[]});
const remote=(id='received')=>({id,kind:'conversation',revision:2,deleted:false,payload:rebindConversation(history.payload,id)});
const stats={getAllAttempts:0,foreignCursorRows:0,receiveRows:0,ackRows:0,cursors:0,switches:0};
const probes=[];
let measuring=false,switchDuring='',switched=false;
const ackTransactions=new WeakSet();
const originals={get:IDBObjectStore.prototype.get,getAll:IDBObjectStore.prototype.getAll,openCursor:IDBObjectStore.prototype.openCursor};
const guarded=store=>measuring&&store.transaction.mode==='readwrite'&&store.transaction.objectStoreNames.contains('entities')&&store.transaction.objectStoreNames.contains('meta');
IDBObjectStore.prototype.get=function(key){
  if(guarded(this)&&this.name==='meta'&&key===prefix+'outbox')ackTransactions.add(this.transaction);
  return originals.get.call(this,key);
};
IDBObjectStore.prototype.getAll=function(...args){
  if(guarded(this)&&this.name==='entities'){
    stats.getAllAttempts++;this.transaction.abort();throw Error('entities.getAll forbidden during sync writes');
  }
  return originals.getAll.apply(this,args);
};
IDBObjectStore.prototype.openCursor=function(...args){
  const request=originals.openCursor.apply(this,args);
  if(guarded(this)&&this.name==='entities'){
    stats.cursors++;
    const phase=ackTransactions.has(this.transaction)?'ack':'receive';let rows=0;
    request.addEventListener('success',()=>{
      const cursor=request.result;if(!cursor)return;
      stats[phase+'Rows']++;rows++;
      if(cursor.value.owner!==owner)stats.foreignCursorRows++;
      // Switch before the production success handler consumes this cursor row.
      if(switchDuring===phase&&!switched&&rows===23){switched=true;stats.switches++;rememberOwner(foreign);}
    });
  }
  return request;
};

async function seed(records=[],batch){
  measuring=false;switchDuring='';switched=false;rememberOwner(owner);
  await appTransaction(['entities','meta'],'readwrite',(tx,done)=>{
    const entities=tx.objectStore('entities'),meta=tx.objectStore('meta');entities.clear();meta.clear();
    for(let index=0;index<count;index++)entities.put(record('unrelated-'+String(index).padStart(3,'0'),basic('unrelated-'+index,maximum-count+1+index)));
    entities.put(record('foreign-chat',basic('foreign-chat',foreignMaximum),{owner:foreign}));
    for(const item of records)entities.put(item);
    meta.put(true,prefix+'consent');meta.put(11,prefix+'cursor');meta.put(batch?maximum:7,'message-sequence:'+owner);
    meta.put({keep:'foreign receipt'},'sync:'+foreign+':remote:foreign-chat');
    if(batch)meta.put(batch,prefix+'outbox');done();
  });
}

async function snapshot(){
  return appTransaction(['entities','meta'],'readonly',(tx,done)=>{
    const entities=tx.objectStore('entities').getAll(),meta=tx.objectStore('meta'),keys=meta.getAllKeys(),values=meta.getAll();
    values.onsuccess=()=>done({entities:entities.result,meta:keys.result.map((key,index)=>[key,values.result[index]])});
  });
}

async function rejected(changes,label){
  const before=await snapshot();let failed=false;measuring=true;
  try{await receiveSyncPage(owner,changes,12);}catch{failed=true;}finally{measuring=false;}
  check(failed,label+' accepted');same(await snapshot(),before,label+' changed body, sequence, cursor or receipts');
  check(stats.getAllAttempts===0,label+' failed because of forbidden getAll');probes.push(label);
}

function fixedRecords(){
  let library,setting;
  for(const version of [1,2]){
    library=receiveLibrarySnapshot(library,owner,'character',version,history.payload.library_snapshots['character@'+version]);
    setting=receiveCreatorSnapshot(setting,owner,creator+'@'+version,'world',history.payload.creator_snapshots[creator+'@'+version].document);
  }
  return [library,setting];
}

async function receive(){
  const fixed=fixedRecords();
  // Keep newer local revisions too; importing history must not replace the current document.
  fixed[0]={...fixed[0],payload:{...fixed[0].payload,snapshot_only:false,current_revision:3,
    document:{...fixed[0].payload.document,name:'LOCAL CURRENT'},versions:{...fixed[0].payload.versions,3:{...fixed[0].payload.document,name:'LOCAL CURRENT'}}}};
  fixed[1]={...fixed[1],payload:{...fixed[1].payload,snapshot_only:false,current_revision:3,
    creator:{...fixed[1].payload.creator,rules:'LOCAL CURRENT'},versions:{...fixed[1].payload.versions,3:{...fixed[1].payload.creator,rules:'LOCAL CURRENT'}}}};
  const historicalLibrary='historical-character',historicalCreator='created_'+'b'.repeat(32);
  fixed.push({...structuredClone(fixed[0]),id:historicalLibrary},{...structuredClone(fixed[1]),id:historicalCreator});
  const historicalRemote=id=>{
    const value=remote(id),payload=value.payload;
    for(const point of [payload.messages[1].before,payload.messages[1].after]){
      point.settings.library_binding.character.id=historicalLibrary;
      point.state.world_id=historicalCreator+'@1';
    }
    payload.library_snapshots[historicalLibrary+'@1']=structuredClone(payload.library_snapshots['character@1']);
    payload.creator_snapshots[historicalCreator+'@1']=structuredClone(payload.creator_snapshots[creator+'@1']);
    return value;
  };
  const existing=record('received',basic('received',42));
  existing.payload.messages[0].uuid=history.payload.messages[0].uuid;
  await seed([...fixed,existing]);const before=await snapshot();
  measuring=true;try{await receiveSyncPage(owner,[historicalRemote('received'),historicalRemote('second')],12);}finally{measuring=false;}
  const saved=await entity('received',owner),second=await entity('second',owner),ids=saved.payload.messages.map(m=>m.id);
  check(ids[0]===42,'Existing message UUID lost its device ID');
  const allocated=[...ids.slice(1),...second.payload.messages.map(m=>m.id)];
  check(new Set(allocated).size===7&&allocated.every(id=>id>maximum&&id<foreignMaximum),'Numeric allocation ignored unrelated maximum or included foreign owner');
  check(await getMeta('message-sequence:'+owner)===maximum+7&&await getMeta(prefix+'cursor')===12,'Sequence/cursor not committed');
  same(saved.payload.memories[0].source_message_ids,[ids[2]],'Memory sources not rebound');
  same(saved.payload.summaries[0].source_message_ids,ids.slice(0,2),'Summary sources not rebound');
  same(saved.payload.messages[1].after.memories[0].source_message_ids,[ids[0]],'Historical memory source not rebound');
  check(saved.payload.settings.library_binding.character.revision===2&&saved.payload.messages[1].before.settings.library_binding.character.revision===1,'Historical Library binding changed');
  check(saved.payload.messages[1].before.settings.library_binding.character.id===historicalLibrary,'Historical-only Library ID changed');
  check(saved.payload.state.world_id===creator+'@2'&&saved.payload.messages[1].before.state.world_id===historicalCreator+'@1','Historical state-only creator binding changed');
  for(const item of fixed)same(await entity(item.id,owner),item,'Local fixed/current versions changed');
  const after=await snapshot();
  same(after.entities.filter(e=>e.id.startsWith('unrelated-')||e.owner===foreign),before.entities.filter(e=>e.id.startsWith('unrelated-')||e.owner===foreign),'Unrelated record changed');
  check((await getMeta(prefix+'remote:received')).revision===2&&(await getMeta(prefix+'remote:second')).revision===2,'Remote receipts missing');
  check(stats.receiveRows>=count,'No real cursor scan observed');
  probes.push('receive-two-conversations','historical-fixed-versions','historical-only-reference-IDs','owner-scoped-numeric-allocation');
  return {allocated,retainedID:ids[0]};
}

async function invalid(){
  for(const kind of ['library','creator']){
    const fixed=scenario==='mismatch'?fixedRecords():[];await seed(fixed);
    const broken=remote('broken');
    if(scenario==='missing'){
      if(kind==='library')delete broken.payload.library_snapshots['character@1'];
      else delete broken.payload.creator_snapshots[creator+'@1'];
    }else{
      if(kind==='library')broken.payload.library_snapshots['character@1'].name='CONFLICT';
      else broken.payload.creator_snapshots[creator+'@1'].document.rules='CONFLICT';
    }
    await rejected([{...remote('valid-first'),payload:basic('valid-first')},broken],scenario+'-'+kind+'-whole-page-rollback');
  }
}

function pending(source,destination){
  return {request_id:'fixture-selection-request',withdrawn:0,revisions:{[source.id]:source.revision},
    changes:[{id:source.id,kind:'conversation',base_revision:source.serverRevision,payload:source.payload,deleted:false}],
    receipt:{changes:[{id:destination,source_id:source.id,revision:3,deleted:false,branched:true}]}};
}

async function settle(){
  const fetch=globalThis.fetch,api=[];
  globalThis.fetch=async(input,init)=>{
    const path=String(input);api.push(path);
    check(!init?.method||init.method==='GET','Cached acknowledgment resent a body');
    if(path==='/api/mobile/status')return Response.json({cloud_mode:true,authenticated:true,owner_scope:owner});
    check(path.startsWith('/api/cloud/app/sync?cursor='),'Unexpected fictional API '+path);
    check(new Headers(init?.headers).get('X-Kyalulu-Owner')===owner,'Wrong API owner');
    return Response.json({changes:[],cursor:11,has_more:false});
  };
  measuring=true;try{await syncNow(owner);}finally{measuring=false;globalThis.fetch=fetch;}
  check(api.length>=2,'Cached acknowledgment path not exercised');
}

async function protections(){
  const dirty=record('dirty',basic('dirty',88),{dirty:true,revision:4});await seed([dirty]);
  const incoming={...remote('dirty'),payload:basic('dirty')};
  measuring=true;try{await receiveSyncPage(owner,[incoming],12);}finally{measuring=false;}
  same(await entity('dirty',owner),dirty,'Unsent original overwritten');probes.push('dirty-original-preserved');
  await seed([record('local',basic('local'),{payload:{...basic('local'),storage_policy:'local'}})]);
  await rejected([remote('valid-first'),{...remote('local'),payload:basic('local')}],'device-only-original-protected');
  await seed([dirty]);const randomUUID=crypto.randomUUID;
  crypto.randomUUID=()=> 'unrelated-159';
  try{await rejected([remote('valid-first'),{id:'dirty',kind:'conversation',revision:3,deleted:true,payload:{}}],'unrelated-recovery-ID-collision');}
  finally{crypto.randomUUID=randomUUID;}
  const batch=pending(dirty,'unrelated-159');await seed([dirty],batch);const before=await snapshot();
  await settle();check(syncState().phase==='error','Unrelated branch ID collision accepted');
  same(await snapshot(),before,'Branch collision changed source, outbox or metadata');probes.push('unrelated-branch-ID-collision');
}

async function ack(){
  const source=record('source',basic('source',88),{dirty:true,revision:4});
  const batch=pending(source,'branched-copy');await seed([source],batch);const before=await snapshot();
  await settle();check(syncState().phase==='saved','Cached acknowledgment failed');
  const saved=await entity('branched-copy',owner),original=await entity('source',owner);
  check(saved.payload.messages[0].id===maximum+1&&saved.serverRevision===3&&!saved.dirty,'Ack branch numeric allocation/receipt wrong');
  check(saved.payload.settings.session_id==='branched-copy'&&saved.payload.state.session_id==='branched-copy','Ack branch not rebound');
  same(original,{...source,dirty:false},'Ack discarded original');
  check(!await getMeta(prefix+'outbox')&&await getMeta('message-sequence:'+owner)===maximum+1,'Ack did not settle atomically');
  const after=await snapshot();same(after.entities.filter(e=>e.id.startsWith('unrelated-')||e.owner===foreign),before.entities.filter(e=>e.id.startsWith('unrelated-')||e.owner===foreign),'Ack changed unrelated records');
  check(stats.ackRows>=count,'No acknowledgment cursor scan observed');probes.push('cached-ack-branch-committed');
}

async function ownerSwitch(){
  await seed();switchDuring='receive';const before=await snapshot();
  await rejected([remote()],'cursor-owner-switch-receive');
  check(switched&&deviceOwner()===foreign,'Receive owner switch was not injected');same(await snapshot(),before,'Receive leaked across owners');
  const source=record('source',basic('source',88),{dirty:true,revision:4}),batch=pending(source,'branched-copy');
  await seed([source],batch);const ackBefore=await snapshot();switchDuring='ack';await settle();
  check(switched&&deviceOwner()===foreign,'Ack owner switch was not injected');
  same(await snapshot(),ackBefore,'Ack owner change committed body, cursor, sequence or receipt removal');probes.push('cursor-owner-switch-ack');
}

async function run(){
  check(localStorage.length===0&&(await indexedDB.databases()).length===0,'Context was not empty');
  let details={};
  if(scenario==='receive')details=await receive();
  else if(scenario==='missing'||scenario==='mismatch')await invalid();
  else if(scenario==='protections')await protections();
  else if(scenario==='ack')await ack();
  else if(scenario==='owner-switch')await ownerSwitch();
  else throw Error('Unknown scenario');
  check(stats.getAllAttempts===0&&stats.foreignCursorRows===0,'Bulk/foreign record reads detected');
  const request=indexedDB.open('kyalulu-app-v1');
  const db=await new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
  check(db.version===2,'DB version changed');db.close();
  return {ok:true,scenario,probes,unrelatedConversations:count,maximum,foreignMaximum,stats,...details};
}
run().then(result=>window.__SYNC_SELECTION__=result).catch(error=>window.__SYNC_SELECTION__={ok:false,scenario,error:String(error),stack:error.stack,probes,stats})
  .finally(()=>{Object.assign(IDBObjectStore.prototype,originals);});
</script>
