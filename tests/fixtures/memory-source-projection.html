// Compare every persisted byte by SHA-256 rather than formatting megabytes of arrays in assertion errors.
async function physical(){

}
async function rejected(task,message){

}
function memory(sid,id){return {id:'memory-'+sid,uuid:'memory-uuid-'+sid,scope:sid,type:'semantic',content:'Fictional fact '+sid,

    created_at:'2026-10-31T00:00:00Z',before:{state:{turn:i},memories:i?[row]:[],unknown:{keep:'before'}},
    after:{state:{turn:i+1},memories:[row],unknown:{keep:'after'}},unknown:{index:i,escaped:'茶🙂é\\"\n'}}));
  return {...newEntity('conversation',sid,{storage_policy:policy,memory_scope_mode:'world',settings:{...settings,session_id:sid},
    messages,memories:[row],summaries:[{id:'summary-'+sid,text:'Keep summary 茶🙂',unknown:[null,true,3]}],draft:'Keep draft '+sid,
    unknown:JSON.parse('{"__proto__":{"keep":true},"extension":[null,true,0,{"keep":"茶🙂"}]}')},account),

const assertSource=value=>{

async function observe(task){

  window.__PROJECTION_PROGRESS__.observation=stats;
  JsonStream.prototype.feed=function(bytes){
    if(this.onMessage&&!this.__projectionObserved){
      const callback=this.onMessage;this.__projectionObserved=true;
      this.onMessage=(message,index)=>{
        stats.callbacks++;stats.max_callback_messages=Math.max(stats.max_callback_messages,++activeCallbacks);
        try{return callback(message,index);}finally{activeCallbacks--;}
      };
    }
    const result=feed.call(this,bytes);
    if(Array.isArray(this.root?.messages)){
      stats.feeds++;stats.max_retained_root_messages=Math.max(stats.max_retained_root_messages,this.root.messages.length);
      check(this.root.messages.length===0,'Parser retained message bodies during feed');
    }

  };
  JsonStream.prototype.finish=function(){
    const root=finish.call(this);

      stats.finishes.push({total:this.totalMessages,retained:root.messages.length,callback:!!this.onMessage});
      check(root.messages.length===0,'Parser retained message bodies at finish');
    }
    return root;
  };
  try{const value=await task();check(stats.feeds>0&&stats.finishes.length>0,'No real source decoder observed');return {value,stats};}

}
async function context(actor){

  for(const value of result.records.values())assertSource(value);
  check(scopedMemoryRows(result).length===2,'Shared retrieval missing own/peer rows');
  return result;
}
function editPeer(ctx){

  row.content='Updated fictional peer fact';row.version++;
}
async function verifyRewrite(before,policy,outbox){

  same(memories,[{...oldMemories[0],content:'Updated fictional peer fact',version:oldMemories[0].version+1}],
    'Peer memory identity/source IDs changed');
  for(const key of ['owner','id','kind','serverRevision','pinned','deleted','unknown_header'])same(after[key],before.peer[key],'Header changed: '+key);
  check(after.revision===before.peer.revision+1&&after.dirty===(policy==='sync'),'Projection revision/dirty policy');
  check(nextHeader.payloadParts.token!==oldHeader.payloadParts.token,'Projection body token did not advance');
  const parts=(await physical()).parts;
  check(!parts.some(([key])=>key[1]==='entity'&&key[2]===peerId&&key[3]===oldHeader.payloadParts.token),'Obsolete peer parts leaked');
  same(await fixedOutbox(owner),outbox,'Fixed outbox rewritten');

    receipt:hash((await getMeta('generation:'+owner+':'+generationId))??null)};

    check(writes.quota_injections===1&&writes.actor_headers===1&&writes.peer_headers===1&&writes.entity_parts>=4&&writes.domain_parts>0,
      'Quota did not occur after full actor, peer rewrite and domain parts');
    same(await physical(),snapshot,'Quota failed to roll back all entity/header/parts/domain/receipt/outbox bytes');
    same(await getMeta('generation:'+owner+':'+generationId),pending,'Pending receipt changed after failed completion');
    const {value,stats}=await observe(()=>saveScopedMemory(ctx,[actor],{[generationId]:receipt}));
    check(value.sessions.length===1&&value.sources.length===1&&value.domain.pending===null,'Atomic retry did not complete actor and peer');
    const peer=await verifyRewrite(before,policy,initial.outbox);
    same(await entity(actorId,owner),value.sessions[0],'Full actor update not persisted');
    same(value.sessions[0].payload,actor.payload,'Full actor history/snapshots/unknown fields lost');
    same(value.sessions[0].unknown_header,initial.actor.unknown_header,'Full actor unknown header lost');
    check(value.sessions[0].revision===actor.revision+1,'Full actor revision did not advance');
    same(await getMeta('generation:'+owner+':'+generationId),receipt,'Completed receipt not persisted');
    check(memoryBinding(value.domain,actorId).entity_revision===value.sessions[0].revision
      &&memoryBinding(value.domain,peerId).entity_revision===peer.revision,'Domain revisions differ from canonical sources');
    Object.assign(evidence,{writes_before_abort:writes,all_store_bytes_rolled_back:true,retry_observation:stats,atomic_retry_succeeded:true});
  }else throw Error('Unknown projection scenario: '+scenario);
  same(outboxPhysical(await physical()),originalOutbox,'Fixed outbox header/token/part bytes changed');
  evidence.fixed_outbox_physically_unchanged=true;
  await rememberExpected(policy,scenario==='catalog'?['legacy']:[]);window.__PROJECTION_PROGRESS__.stage='passed';return {...evidence,ok:true};
}
window.__MEMORY_SOURCE_PROJECTION__={run,resume};
