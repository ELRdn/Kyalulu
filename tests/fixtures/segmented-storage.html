      const removal=await deviceFetch('/api/chat/sessions/'+value.id+'/data',{method:'DELETE'});check(removal.ok,'Local permanent deletion failed');
      check((await entity(value.id,owner)).deleted&&!(await entity(value.id,owner)).payload.unknown,'Local body not erased after explicit permanent deletion');
      check((await physical()).parts.filter(part=>part[0][1]==='entity'&&part[0][2]===value.id).length===1,'Local old parts leaked');
      probes.push('device-branch-atomic-rollback','historical-branch','branch-add-collision','explicit-local-body-removal');return;
    }
    localStorage.setItem('kyalulu-execution-target','device');
    const {mountSessionPolicy}=await import('./session-policy.tsx');
    const node=document.createElement('div');document.body.append(node);const root=mountSessionPolicy(node,value.id);
    const wait=async(test)=>{for(let index=0;index<200;index++){if(await test())return;await new Promise(resolve=>setTimeout(resolve,10));}throw Error('Pin UI did not settle');};
    await wait(()=>node.querySelector('input[type=checkbox]'));await wait(async()=>!(node.querySelector('input').disabled));
    const before=await header();node.querySelector('input').click();await wait(async()=>(await header()).pinned);
    same((await header()).payloadParts,before.payloadParts,'Production pin UI changed manifest');same((await entity(value.id,owner)).payload,value.payload,'Pin UI lost history');root.unmount();
    probes.push('production-session-policy-pin','manifest-preserved');return;
  }
  if(scenario==='roundtrip'){
    let status;try{await appTransaction(['meta'],'readwrite',()=>{throw Object.assign(Error('Fictional conflict'),{status:409});});}catch(error){status=error.status;}
    check(status===409,'Transaction lost original error status');
    const before=await header(),opened=await openEntity(value.id,owner);same(opened.payload,value.payload,'Open changed historical body');
    await appTransaction(['entities'],'readwrite',(tx,done)=>{const store=tx.objectStore('entities'),read=store.get([owner,value.id]);read.onsuccess=()=>{store.put({...read.result,pinned:true});done();};});
    same((await header()).payloadParts,before.payloadParts,'Metadata update changed manifest');
    const batch={request_id:'fixed-independent',withdrawn:0,revisions:{history:7},changes:[{id:value.id,kind:value.kind,base_revision:4,payload:value.payload,deleted:false}]};
    await appTransaction(['meta','parts'],'readwrite',(tx,done)=>writeOutbox(tx,owner,batch,done));
    const fixed=await getMeta('sync:'+owner+':outbox');check(fixed.changesParts.token!==before.payloadParts.token&&fixed.changes[0].payload&&Object.keys(fixed.changes[0].payload).length===0,'Outbox shares live payload or retains inline body');
    const shortened={...value,payload:{storage_policy:'sync',messages:[{id:9,uuid:'retain',content:'short'}]}};
    await save(shortened);same(await entity(value.id,owner),shortened,'Shortened write failed');same(await fixedOutbox(owner),batch,'Fixed outbox bytes changed with live entity');
    raw=await physical();check(raw.parts.filter(part=>part[0][1]==='entity').length===1,'Surplus entity parts leaked');
    await appTransaction(['meta','parts'],'readwrite',(tx,done)=>writeOutbox(tx,owner,null,done));
    check(!(await physical()).parts.some(part=>part[0][1]==='outbox'),'Outbox parts leaked');
    same(await entity(value.id,owner),shortened,'Removal changed live body');probes.push('unicode-huge-scalar-historical','metadata-manifest','independent-outbox','shorten-cleanup','remove-cleanup','reopen');return;
  }
  if(scenario.startsWith('corrupt-')){
    const ref=(await header()).payloadParts,key=[owner,'entity',value.id,ref.token,1];
    await appTransaction(['parts'],'readwrite',(tx,done)=>{const store=tx.objectStore('parts'),read=store.get(key);read.onsuccess=()=>{
      if(scenario==='corrupt-missing')store.delete(key);
      else if(scenario==='corrupt-size')store.put(read.result.subarray(1),key);
      else {read.result[0]^=1;store.put(read.result,key);}done();};});
    const before=await physical();await rejected(()=>entity(value.id,owner),'Corruption became empty/successful history');
    await rejected(()=>save({...value,payload:{messages:[]}}),'Replacement erased corrupt original');same(await physical(),before,'Corrupt originals changed');probes.push('read-fail-closed','replacement-rollback');return;
  }
  if(scenario==='owner-fence'){
    const other={...value,owner:foreign,payload:{messages:[{id:900000,content:'FOREIGN'}]}};await save(other);
    check((await allEntities(owner)).length===1&&(await allEntities(foreign)).length===1,'Owner list leaked');
    const before=await physical(),get=IDBObjectStore.prototype.get;let changed=false;
    IDBObjectStore.prototype.get=function(key){const request=get.call(this,key);if(this.name==='parts'&&!changed)request.addEventListener('success',()=>{changed=true;rememberOwner(foreign);});return request;};
    try{await rejected(()=>saveEntity({...value,payload:{...value.payload,title:'EDIT'}},7,{'receipt':true}),'Owner change committed');}finally{IDBObjectStore.prototype.get=get;rememberOwner(owner);}
    check(changed,'Owner fault not reached');same(await physical(),before,'Owner switch leaked a write');probes.push('owner-isolation','part-callback-owner-fence');return;
  }
  if(scenario==='quota'){
    const before=await physical(),add=IDBObjectStore.prototype.add;let writes=0;
    IDBObjectStore.prototype.add=function(value,key){if(this.name==='parts'&&++writes===3)throw new DOMException('Fixture after two successful parts','QuotaExceededError');return add.call(this,value,key);};
    try{await rejected(()=>saveEntity({...value,payload:{...value.payload,title:'EDIT'}},7,{'receipt':true,['message-sequence:'+owner]:999}),'Quota write succeeded');}finally{IDBObjectStore.prototype.add=add;}
    check(writes===3,'Did not fail after two successful part writes');same(await physical(),before,'Quota changed body/parts/receipt/sequence');
    await saveEntity({...value,payload:{...value.payload,title:'EDIT'}},7,{'receipt':true});
    check((await entity(value.id,owner)).revision===8&&await getMeta('receipt')===true,'Reopen/retry did not persist');probes.push('quota-after-two-parts','atomic-rollback','reopen-retry');return;
  }
  if(scenario==='collisions'){
    const before=await physical();await rejected(()=>appTransaction(['entities','meta'],'readwrite',(tx,done)=>{writeEntity(tx,{...value,payload:{messages:[]}},'add');tx.objectStore('meta').put(true,'receipt');done();}),'Add collision overwrote');
    same(await physical(),before,'Add collision changed records');
    const random=crypto.randomUUID,token=(await header()).payloadParts.token;crypto.randomUUID=()=>token;
    try{await rejected(()=>save(value),'Part identity collision overwrote');}finally{crypto.randomUUID=random;}
    same(await physical(),before,'Part collision changed records');probes.push('entity-add-collision','part-add-collision');return;
  }
  if(scenario==='versionchange'){
    let upgrade,connection,seen=false;
    const reading=appTransaction(['entities'],'readonly',(tx,done)=>{
      connection=tx.db;const handler=connection.onversionchange;connection.onversionchange=event=>{seen=true;handler.call(connection,event);};
      const next=()=>{const read=tx.objectStore('entities').get([owner,value.id]);read.onsuccess=()=>seen?done(read.result):next();};
      next();upgrade=open(4);
    });
    await reading;const db=await upgrade;db.close();check(seen,'Connection did not observe versionchange');
    let closed=false;try{connection.transaction('entities');}catch{closed=true;}check(closed,'Old connection still open');
    await rejected(()=>entity(value.id,owner),'Old app opened newer DB');probes.push('versionchange-close','no-downgrade');return;
  }
  throw Error('Unknown scenario');
}
run().then(()=>window.__SEGMENTED__={ok:true,scenario,probes,...metrics}).catch(error=>window.__SEGMENTED__={ok:false,scenario,error:String(error),stack:error.stack});
</script>
