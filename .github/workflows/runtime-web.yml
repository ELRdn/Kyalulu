name: Runtime and Web

on:
  push:
    paths: ['apps/**', 'packages/**', 'runtime/**', 'tests/**', 'scripts/**', 'deploy/remote/**', 'pnpm-lock.yaml', 'uv.lock', '.github/workflows/runtime-web.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'runtime/**', 'tests/**', 'scripts/**', 'deploy/remote/**', 'pnpm-lock.yaml', 'uv.lock', '.github/workflows/runtime-web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-packages --all-extras --no-install-workspace
      - run: pnpm typecheck
      - run: pnpm --filter web test
      - run: uv run --no-sync python scripts/verify_device_exports.py
      - run: pnpm --filter web build
      - run: pnpm --filter desktop build
      - run: uv run --no-sync python -m pytest tests -q
      - run: uv run --no-sync python -B tests/fixtures/unified-disaster-recovery.py --evidence-dir .artifacts/disaster-recovery-ci
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python tests/e2e_outbox_guard.py
      - run: uv run --no-sync python tests/e2e_segmented_storage.py
      - run: uv run --no-sync python tests/e2e_sync_selection.py
      - run: uv run --no-sync python tests/e2e_offline_cache.py
      - run: uv run --no-sync python tests/e2e_device_quota.py
      - run: uv run --no-sync python tests/e2e_device_export.py
      - run: uv run --no-sync python tests/e2e_device_import.py
      - run: uv run --no-sync python tests/e2e_publications.py
      - run: uv run --no-sync python tests/e2e_unified_entry.py
      - run: uv run --no-sync python tests/e2e_cloud_login.py
      - run: uv run --no-sync python tests/e2e_commercial_ui.py
      - run: uv run --no-sync python tests/e2e_memory_language.py
      - run: uv run --no-sync python tests/e2e_device_memory.py
      - run: uv run --no-sync python tests/e2e_device_generation_lock.py
      - run: uv run --no-sync python tests/e2e_device_memory_scopes.py
      - run: uv run --no-sync python tests/e2e_research_language.py
      - run: uv run --no-sync python tests/e2e_device_research.py
      - run: uv run --no-sync python tests/e2e_device_benchmarks.py
      - run: uv run --no-sync python tests/e2e_native_restore.py
      - run: node scripts/remote_crypto_build_wrapper.mjs
      - run: uv run --no-sync python scripts/remote_crypto_wrapper_interop.py
      - run: uv run --no-sync python tests/e2e_remote.py
