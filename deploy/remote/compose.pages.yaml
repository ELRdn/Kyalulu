# Standalone alternative to compose.yaml: APP is hosted on Cloudflare Pages.
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/remote/Dockerfile
    environment:
      RELAY_DB: /data/relay.sqlite3
      RELAY_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
    volumes: [relay_data:/data]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: none
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile.relay:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: none
volumes:
  relay_data:
  caddy_data:
  caddy_config:
